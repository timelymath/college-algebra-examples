# ------------------------------------------------------------------
# College Algebra 2e Example Videos: the one file the website is built from.
#
# Structure: course -> chapters -> sections -> examples.
# Any level can carry a `resources:` list. Each resource needs a
# `label` and a `url`; `kind` picks the icon (video, guide, worksheet,
# slides, practice, link). A url starting with "files/" points to a
# file stored in this repo's files/ folder.
#
# Sections are released whole: all of a section's videos and its playlist
# go public together. A section stays off the page until at least one of
# its examples has a `video:` link. Leave `video:` empty while the videos
# are private; the nightly sync fills the links in from each section's
# `playlist_id` once the playlist is public (private playlists can't be read).
# `playlist_url` and `review` (the section review video) show as links on
# the section once it's released.
#
# A scheduled video can get its link early plus `public_at` (UTC); the page
# shows "Coming Nov 2" until then, and the Watch button after.
#
# An example can also carry `try_it` (the textbook's Try It: n, prompt,
# hint, answer, all allowing simple HTML and $math$, plus an optional
# `graph`) and `explore` (an interactive graph). Both `graph` and
# `explore` name a Desmos graph in data/graphs/<name>.yaml.
# ------------------------------------------------------------------

course:
  title: College Algebra 2e, Example by Example
  tagline: A short video walkthrough for every worked example in OpenStax College Algebra 2e, in textbook order.
  author: Timely Math Tutor
  textbook_url: https://openstax.org/details/books/college-algebra-2e
  channel_url: https://www.youtube.com/channel/UCVCzSgqaPzWiZoZ2FTAlo_A
  resources: []

chapters:
- number: 8
  title: Analytic Geometry
  sections:
  - number: "8.1"
    title: The Ellipse
    textbook_url: https://openstax.org/books/college-algebra-2e/pages/8-1-the-ellipse
    playlist_id: PLcH_xb9X8DAs
    playlist_url: https://www.youtube.com/playlist?list=PLcH_xb9X8DAs
    review: https://youtu.be/rJO7l4uKaRc
    resources:
    - kind: guide
      label: Section 8.1 one-page summary (PDF)
      url: files/ch8/8.1-summary.pdf
    examples:
    - n: 1
      title: "Writing the Equation of an Ellipse Centered at the Origin in Standard Form"
      video: https://youtu.be/XLMdJZ7BRXM
      explore: 8.1-ex1-explore
      try_it:
        n: 1
        prompt: 'What is the standard form equation of the ellipse that has vertices $(0, \pm 4)$ and foci $\left(0, \pm\sqrt{15}\right)$?'
        hint: 'The vertices and foci are on the $y$-axis, so the major axis is vertical. Start from $\dfrac{x^2}{b^2} + \dfrac{y^2}{a^2} = 1$, read $a$ off the vertices and $c$ off the foci, then use $c^2 = a^2 - b^2$ to find $b^2$.'
        answer: '<p>$x^2 + \dfrac{y^2}{16} = 1$</p><p class="ti-why">$a = 4$ and $c = \sqrt{15}$, so $15 = 16 - b^2$ and $b^2 = 1$.</p>'
    - n: 2
      title: "Writing the Equation of an Ellipse Centered at a Point Other Than the Origin"
      video: https://youtu.be/NFZyYqgxS9k
      try_it:
        n: 2
        prompt: 'What is the standard form equation of the ellipse that has vertices $(-3, 3)$ and $(5, 3)$ and foci $\left(1 - 2\sqrt{3}, 3\right)$ and $\left(1 + 2\sqrt{3}, 3\right)$?'
        hint: 'The vertices share $y = 3$, so the major axis is horizontal: $\dfrac{(x-h)^2}{a^2} + \dfrac{(y-k)^2}{b^2} = 1$. The center is the midpoint of the vertices, $a$ is the distance from the center to a vertex, and $c$ is the distance from the center to a focus.'
        answer: '<p>$\dfrac{(x-1)^2}{16} + \dfrac{(y-3)^2}{4} = 1$</p><p class="ti-why">Center $(1, 3)$, $a = 4$, $c = 2\sqrt{3}$, so $12 = 16 - b^2$ and $b^2 = 4$.</p>'
    - n: 3
      title: "Graphing an Ellipse Centered at the Origin"
      video: https://youtu.be/1Om18-69vHQ
      explore: 8.1-ex3-explore
      try_it:
        n: 3
        prompt: 'Graph the ellipse given by the equation $\dfrac{x^2}{36} + \dfrac{y^2}{4} = 1$. Identify and label the center, vertices, co-vertices, and foci.'
        hint: 'The larger denominator, $36$, is under $x^2$, so the major axis is horizontal: $a^2 = 36$ and $b^2 = 4$. Then find $c$ from $c^2 = a^2 - b^2$.'
        answer: '<ul><li>Center: $(0, 0)$</li><li>Vertices: $(\pm 6, 0)$</li><li>Co-vertices: $(0, \pm 2)$</li><li>Foci: $\left(\pm 4\sqrt{2}, 0\right)$, since $c^2 = 36 - 4 = 32$</li></ul>'
        graph: 8.1-try3
    - n: 4
      title: "Graphing an Ellipse Centered at the Origin from an Equation Not in Standard Form"
      video: https://youtu.be/Gd6DpE06EPc
      try_it:
        n: 4
        prompt: 'Graph the ellipse given by the equation $49x^2 + 16y^2 = 784$. Rewrite the equation in standard form. Then identify and label the center, vertices, co-vertices, and foci.'
        hint: 'Standard form has $1$ on the right side, so divide every term by $784$ and simplify each fraction. Then the larger denominator tells you which way the ellipse stretches.'
        answer: '<p>$\dfrac{x^2}{16} + \dfrac{y^2}{49} = 1$</p><ul><li>Center: $(0, 0)$</li><li>Vertices: $(0, \pm 7)$</li><li>Co-vertices: $(\pm 4, 0)$</li><li>Foci: $\left(0, \pm\sqrt{33}\right)$, since $c^2 = 49 - 16 = 33$</li></ul>'
        graph: 8.1-try4
    - n: 5
      title: "Graphing an Ellipse Centered at (h, k)"
      video: https://youtu.be/0hI8JdPbDGQ
      explore: 8.1-ex5-explore
      try_it:
        n: 5
        prompt: 'Graph the ellipse given by the equation $\dfrac{(x-4)^2}{36} + \dfrac{(y-2)^2}{20} = 1$. Identify and label the center, vertices, co-vertices, and foci.'
        hint: 'The center is $(h, k) = (4, 2)$. The larger denominator, $36$, is under the $x$ part, so $a = 6$ runs left and right from the center, and $b = \sqrt{20} = 2\sqrt{5}$ runs up and down.'
        answer: '<ul><li>Center: $(4, 2)$</li><li>Vertices: $(-2, 2)$ and $(10, 2)$</li><li>Co-vertices: $\left(4, 2 - 2\sqrt{5}\right)$ and $\left(4, 2 + 2\sqrt{5}\right)$</li><li>Foci: $(0, 2)$ and $(8, 2)$, since $c^2 = 36 - 20 = 16$</li></ul>'
        graph: 8.1-try5
    - n: 6
      title: "Graphing an Ellipse Centered at (h, k) by First Writing It in Standard Form"
      video: https://youtu.be/8H1h4RHAxRY
      try_it:
        n: 6
        prompt: 'Express the equation of the ellipse in standard form. Identify the center, vertices, co-vertices, and foci of the ellipse. $$4x^2 + y^2 - 24x + 2y + 21 = 0$$'
        hint: 'Group the $x$ terms and the $y$ terms and move $21$ to the right side. Factor $4$ out of the $x$ group, complete the square in each group, and add the same amounts to the right side. Then divide so the right side is $1$.'
        answer: '<p>$\dfrac{(x-3)^2}{4} + \dfrac{(y+1)^2}{16} = 1$</p><ul><li>Center: $(3, -1)$</li><li>Vertices: $(3, -5)$ and $(3, 3)$</li><li>Co-vertices: $(1, -1)$ and $(5, -1)$</li><li>Foci: $\left(3, -1 - 2\sqrt{3}\right)$ and $\left(3, -1 + 2\sqrt{3}\right)$, since $c^2 = 16 - 4 = 12$</li></ul>'
        graph: 8.1-try6
    - n: 7
      title: "Locating the Foci of a Whispering Chamber"
      video: https://youtu.be/LoTrHAr-tUg
      explore: 8.1-ex7-explore
      try_it:
        n: 7
        prompt: '<p>Suppose a whispering chamber is 480 feet long and 320 feet wide.</p><ol type="a"><li>What is the standard form of the equation of the ellipse representing the room? Hint: assume a horizontal ellipse, and let the center of the room be the point $(0, 0)$.</li><li>If two people are standing at the foci of this room and can hear each other whisper, how far apart are the people? Round to the nearest foot.</li></ol>'
        hint: 'The length is the major axis, so $a$ is half of $480$ and $b$ is half of $320$. The people stand at the foci, $(\pm c, 0)$, so the distance between them is $2c$, where $c^2 = a^2 - b^2$.'
        answer: '<ol type="a"><li>$\dfrac{x^2}{57{,}600} + \dfrac{y^2}{25{,}600} = 1$, from $a = 240$ and $b = 160$</li><li>$c^2 = 57{,}600 - 25{,}600 = 32{,}000$, so $c \approx 178.9$ and the people stand about $358$ feet apart.</li></ol>'
  - number: "8.2"
    title: The Hyperbola
    textbook_url: https://openstax.org/books/college-algebra-2e/pages/8-2-the-hyperbola
    playlist_id: PLTJ6CPXO61xM
    playlist_url: https://www.youtube.com/playlist?list=PLTJ6CPXO61xM
    examples:
    - n: 1
      title: "Locating a Hyperbola's Vertices and Foci"
    - n: 2
      title: "Finding the Equation of a Hyperbola Centered at (0, 0) Given its Foci and Vertices"
    - n: 3
      title: "Finding the Equation of a Hyperbola Centered at (h, k) Given its Foci and Vertices"
    - n: 4
      title: "Graphing a Hyperbola Centered at (0, 0) Given an Equation in Standard Form"
    - n: 5
      title: "Graphing a Hyperbola Centered at (h, k) Given an Equation in General Form"
    - n: 6
      title: "Solving Applied Problems Involving Hyperbolas"
