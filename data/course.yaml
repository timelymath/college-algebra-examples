# ------------------------------------------------------------------
# College Algebra 2e Example Videos: the one file the website is built from.
#
# Structure: course -> chapters -> sections -> examples.
# Any level can carry a `resources:` list. Each resource needs a
# `label` and a `url`; `kind` picks the icon (video, guide, worksheet,
# slides, practice, link). A url starting with "files/" points to a
# file stored in this repo's files/ folder.
#
# Leave `video:` empty until the video is on YouTube. The nightly sync
# fills it in automatically from the course playlist.
#
# A scheduled video gets its link now plus `public_at` (UTC). The page
# shows "Coming Nov 2" until then, and the Watch button after.
# ------------------------------------------------------------------

course:
