height: 360
panel: false
view: {x: [-4, 12], y: [-3.5, 7.5]}
expressions:
  - {id: ell, latex: '\frac{\left(x-4\right)^2}{36}+\frac{\left(y-2\right)^2}{20}=1', color: '#1F7A8C', lineWidth: 3}
  - {id: O, latex: '\left(4,2\right)', color: '#1F2633', label: '(4, 2)', showLabel: true, labelOrientation: below}
  - {id: V1, latex: '\left(10,2\right)', color: '#1F7A8C', label: '(10, 2)', showLabel: true, labelOrientation: right}
  - {id: V2, latex: '\left(-2,2\right)', color: '#1F7A8C', label: '(−2, 2)', showLabel: true, labelOrientation: left}
  - {id: W1, latex: '\left(4,2+2\sqrt{5}\right)', color: '#5B6577', label: '(4, 2 + 2√5)', showLabel: true, labelOrientation: above}
  - {id: W2, latex: '\left(4,2-2\sqrt{5}\right)', color: '#5B6577', label: '(4, 2 − 2√5)', showLabel: true, labelOrientation: below}
  - {id: F1, latex: '\left(8,2\right)', color: '#D9573B', label: '(8, 2)', showLabel: true, labelOrientation: above}
  - {id: F2, latex: '\left(0,2\right)', color: '#D9573B', label: '(0, 2)', showLabel: true, labelOrientation: above}
