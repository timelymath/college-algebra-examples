title: 'Explore: which way does it stretch?'
caption: 'Change the denominators $m$ (under $x^2$) and $n$ (under $y^2$). The larger one is always $a^2$: the ellipse stretches along that axis, the vertices are $a$ from the center, and the foci are $c$ from the center, where $c^2 = a^2 - b^2$. The example starts at $m = 9$ and $n = 25$.'
height: 460
panel: true
view: {x: [-7, 7], y: [-7, 7]}
expressions:
  - {id: m, latex: 'm=9', sliderBounds: {min: '1', max: '36', step: '1'}}
  - {id: n, latex: 'n=25', sliderBounds: {min: '1', max: '36', step: '1'}}
  - {id: ell, latex: '\frac{x^2}{m}+\frac{y^2}{n}=1', color: '#1F7A8C', lineWidth: 3}
  - {id: a, latex: 'a=\sqrt{\max\left(m,n\right)}'}
  - {id: b, latex: 'b=\sqrt{\min\left(m,n\right)}'}
  - {id: c, latex: 'c=\sqrt{a^2-b^2}'}
  - {id: v, latex: 'v=\left\{n>m:1,0\right\}', secret: true}
  - {id: O, latex: '\left(0,0\right)', color: '#1F2633', label: 'center', showLabel: true, labelOrientation: below, secret: true}
  - {id: V1, latex: '\left(a(1-v),\ av\right)', color: '#1F7A8C', label: 'vertex', showLabel: true, labelOrientation: right, secret: true}
  - {id: V2, latex: '\left(-a(1-v),\ -av\right)', color: '#1F7A8C', label: 'vertex', showLabel: true, labelOrientation: right, secret: true}
  - {id: W1, latex: '\left(bv,\ b(1-v)\right)', color: '#5B6577', label: 'co-vertex', showLabel: true, labelOrientation: right, secret: true}
  - {id: W2, latex: '\left(-bv,\ -b(1-v)\right)', color: '#5B6577', label: 'co-vertex', showLabel: true, labelOrientation: left, secret: true}
  - {id: F1, latex: '\left(c(1-v),\ cv\right)', color: '#D9573B', label: 'focus', showLabel: true, labelOrientation: left, secret: true}
  - {id: F2, latex: '\left(-c(1-v),\ -cv\right)', color: '#D9573B', label: 'focus', showLabel: true, labelOrientation: left, secret: true}
