height: 380
panel: false
view: {x: [-1, 7], y: [-7, 5]}
expressions:
  - {id: ell, latex: '\frac{\left(x-3\right)^2}{4}+\frac{\left(y+1\right)^2}{16}=1', color: '#1F7A8C', lineWidth: 3}
  - {id: O, latex: '\left(3,-1\right)', color: '#1F2633', label: '(3, −1)', showLabel: true, labelOrientation: left}
  - {id: V1, latex: '\left(3,3\right)', color: '#1F7A8C', label: '(3, 3)', showLabel: true, labelOrientation: above}
  - {id: V2, latex: '\left(3,-5\right)', color: '#1F7A8C', label: '(3, −5)', showLabel: true, labelOrientation: below}
  - {id: W1, latex: '\left(5,-1\right)', color: '#5B6577', label: '(5, −1)', showLabel: true, labelOrientation: right}
  - {id: W2, latex: '\left(1,-1\right)', color: '#5B6577', label: '(1, −1)', showLabel: true, labelOrientation: left}
  - {id: F1, latex: '\left(3,-1+2\sqrt{3}\right)', color: '#D9573B', label: '(3, −1 + 2√3)', showLabel: true, labelOrientation: right}
  - {id: F2, latex: '\left(3,-1-2\sqrt{3}\right)', color: '#D9573B', label: '(3, −1 − 2√3)', showLabel: true, labelOrientation: right}
