title: 'Explore: where should the two people stand?'
caption: 'Change the room''s length $L$ and width $W$ (in feet). The people stand at the foci, so they are $D = 2c$ feet apart. The example''s room is $96$ by $46$ feet.'
height: 440
panel: true
view: {x: [-72, 72], y: [-32, 32]}
expressions:
  - {id: L, latex: 'L=96', sliderBounds: {min: '60', max: '140', step: '2'}}
  - {id: W, latex: 'W=46', sliderBounds: {min: '20', max: '58', step: '2'}}
  - {id: D, latex: 'D=2c'}
  - {id: c, latex: 'c=\sqrt{a^2-b^2}'}
  - {id: a, latex: 'a=\frac{L}{2}'}
  - {id: b, latex: 'b=\frac{W}{2}'}
  - {id: ell, latex: '\frac{x^2}{a^2}+\frac{y^2}{b^2}=1', color: '#1F7A8C', lineWidth: 3}
  - {id: F1, latex: '\left(-c,0\right)', color: '#D9573B', label: 'whisperer', showLabel: true, labelOrientation: above, pointSize: 12, secret: true}
  - {id: F2, latex: '\left(c,0\right)', color: '#D9573B', label: 'listener', showLabel: true, labelOrientation: above, pointSize: 12, secret: true}
  - {id: gap, latex: '\left((2t-1)c,\ 0\right)', color: '#D9573B', lineStyle: DASHED, parametricDomain: {min: '0', max: '1'}, secret: true}
